<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>

    <div>
        <h1>Cruds</h1>
        <p>Product Management System</p>
    </div>

    <div id="inp-title">
        <input type="text" name="title" id="title" placeholder="Title">
    </div>
    <div id="tot-price">
        <input type="number" name="price" id="price" placeholder="Price" onkeyup="totalPrice()" required>
        <input type="number" name="taxes" id="taxes" placeholder="Taxes" onkeyup="totalPrice()">
        <input type="number" name="ads" id="ads" placeholder="Ads" onkeyup="totalPrice()">
        <input type="number" name="discount" id="discount" placeholder="Discount" onkeyup="totalPrice()">
        <span id="total">3215</span>

    </div>

    <div class="co-cat">
        <input type="number" name="count" id="count" placeholder="Count">
        <input type="text" name="category" id="category" placeholder="Category">
    </div>

    <div class="btn-create">
        <button id="create">create</button>
    </div>



    <div>
        <input type="text" onkeyup="actionSearch(this.value)" name="search" id="search" placeholder="Search">
        <div class="btns">
            <button onclick="searchMood(this.id)" id="titles">Search by title</button>
            <button onclick="searchMood(this.id)" id="categorys">Search by category</button>
        </div>

    </div>

    <div class="who">

    </div>



    <div id="table" class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>id</th>
                    <th>title</th>
                    <th>price</th>
                    <th>taxes</th>
                    <th>ads</th>
                    <th>discount</th>
                    <th>total</th>
                    <th>category</th>
                    <th class="btnsd">update</th>
                    <th class="btnsd">delete</th>
                </tr>
            </thead>

            <tbody id="tbody">




            </tbody>


        </table>
    </div>





    <script src="main.js"></script>
</body>

</html>
